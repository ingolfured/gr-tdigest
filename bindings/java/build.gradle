// bindings/java/build.gradle

plugins {
  id 'java'
  id 'maven-publish'
  id 'signing'
}

// An internal repository is exclusive: failed requests never fall back to Central.
def dependencyRepo = providers.environmentVariable('TDIGEST_MAVEN_REPOSITORY_URL').orNull
repositories {
  if (dependencyRepo != null) {
    if (dependencyRepo.isBlank()) throw new GradleException('TDIGEST_MAVEN_REPOSITORY_URL must not be blank')
    maven {
      name = 'internalDependencies'
      url = uri(dependencyRepo)
      allowInsecureProtocol = uri(dependencyRepo).scheme == 'http'
      def user = providers.environmentVariable('TDIGEST_MAVEN_USERNAME').orNull
      if (user != null) {
        credentials {
          username = user
          password = providers.environmentVariable('TDIGEST_MAVEN_PASSWORD').orNull
        }
      }
    }
  } else {
    mavenCentral()
  }
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/* -------- Read version from ../../Cargo.toml (no external deps) -------- */
def repoRoot  = file('../../')
def cargoToml = new File(repoRoot, 'Cargo.toml')
if (!cargoToml.exists()) {
  throw new GradleException("Cargo.toml not found at ${cargoToml.absolutePath}")
}
def cargoText = cargoToml.getText('UTF-8')

// Grab the version from the first [package] block's version="..."
def cargoVersion = {
  def inPkg = false
  for (line in cargoText.readLines()) {
    if (line =~ /^\s*\[package\]\s*$/) { inPkg = true; continue }
    if (inPkg && (line =~ /^\s*\[.*\]\s*$/)) break
    if (inPkg) {
      def m = (line =~ /^\s*version\s*=\s*"([^"]+)"\s*$/)
      if (m.find()) return m.group(1)
    }
  }
  throw new GradleException("Unable to find version in [package] of Cargo.toml")
}.call()

/* -------- Coordinates -------- */
group   = 'gr.tdigest'
version = cargoVersion

/* -------- Java target (broad compatibility) -------- */
java {
  sourceCompatibility = JavaVersion.VERSION_11
  targetCompatibility = JavaVersion.VERSION_11
  withSourcesJar()
  withJavadocJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 11 }

/* -------- Paths -------- */
def cargoTarget = providers.environmentVariable('CARGO_TARGET_DIR').orNull
def targetDir = cargoTarget ? repoRoot.toPath().resolve(cargoTarget).toFile() : new File(repoRoot, 'target')
def targetRel = new File(targetDir, 'release')
def genResDir = new File(buildDir, 'generated-resources')

/* -------- Build native with feature `java` -------- */
tasks.register('cargoBuild', Exec) {
  onlyIf { !providers.environmentVariable('TDIGEST_NATIVE_FILE').isPresent() }
  workingDir repoRoot
  def args = ['cargo', 'build', '--locked', '--release', '--features', 'java']
  if (providers.environmentVariable('TDIGEST_OFFLINE').orElse('0').get().toLowerCase(Locale.ROOT) in ['1','true','yes']) {
    args.add('--offline')
  }
  commandLine args
  standardOutput = System.out
  errorOutput    = System.err
}

/* -------- Copy native into JAR resources (canonical name only) -------- */
/* Library base name must match System.loadLibrary("gr_tdigest") */
def libBase = "gr_tdigest"
def os = org.gradle.internal.os.OperatingSystem.current()
def libFile = os.isWindows() ? "${libBase}.dll"
           : os.isMacOsX()   ? "lib${libBase}.dylib"
                              : "lib${libBase}.so"

tasks.register('copyNative') {
  dependsOn tasks.named('cargoBuild')
  outputs.dir(genResDir)
  // Rust/JNI symbol changes are not tracked by Gradle inputs here; always refresh.
  outputs.upToDateWhen { false }
  doLast {
    def selected = providers.environmentVariable('TDIGEST_NATIVE_FILE').orNull
    def src = selected ? repoRoot.toPath().resolve(selected).toFile() : new File(targetRel, libFile)
    if (!src.isFile()) {
      throw new GradleException("Native file not found: ${src.absolutePath} — ensure Cargo built the cdylib named '${libBase}'.")
    }

    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    arch = (arch in ['x86_64','amd64']) ? 'x86_64'
        : (arch in ['aarch64','arm64']) ? 'aarch64'
        : arch
    def plat = os.isWindows() ? 'windows' : (os.isMacOsX() ? 'macos' : 'linux')

    // This task owns generated resources. Remove stale payloads from prior
    // overrides/platforms, then always use the loader's canonical file name.
    delete genResDir
    def dest = new File(genResDir, "META-INF/native/${plat}-${arch}")
    dest.mkdirs()

    copy { from src; into dest; rename { libFile } }
    println "Packaged native -> ${new File(dest, libFile).absolutePath}"
  }
}

/* -------- Source layout: Java + generated resources -------- */
sourceSets {
  main {
    java {
      srcDirs = ['src']
      exclude 'test/**'
    }
    resources.srcDirs = [genResDir]   // include META-INF/native/... in jar
  }
}

/* -------- Jar configuration -------- */
tasks.named('processResources').configure { dependsOn tasks.named('copyNative') }

tasks.named('jar').configure {
  dependsOn tasks.named('copyNative')
  manifest { attributes('Main-Class': 'gr.SmokeMain',
      'Implementation-Title': 'gr-tdigest', 'Implementation-Version': project.version,
      'TDigest-Source-SHA': providers.environmentVariable('TDIGEST_SOURCE_SHA').orElse('unrecorded').get(),
      'TDigest-Native-Allocator': 'system') }
  doFirst {
    def payload = fileTree(genResDir).matching { include '**/*.so', '**/*.dylib', '**/*.dll' }.singleFile
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    payload.withInputStream { input ->
      byte[] buffer = new byte[65536]
      int length
      while ((length = input.read(buffer)) > 0) digest.update(buffer, 0, length)
    }
    manifest.attributes('TDigest-Native-SHA256': digest.digest().encodeHex().toString())
  }
  doLast {
    def jarFile = archiveFile.get().asFile
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    arch = (arch in ['x86_64','amd64']) ? 'x86_64' : (arch in ['aarch64','arm64']) ? 'aarch64' : arch
    def plat = os.isWindows() ? 'windows' : (os.isMacOsX() ? 'macos' : 'linux')
    def expected = "META-INF/native/${plat}-${arch}/${libFile}"
    new java.util.jar.JarFile(jarFile).withCloseable { archive ->
      def payloads = archive.entries().findAll { !it.directory && it.name.startsWith('META-INF/native/') }
      if (payloads.size() != 1 || payloads[0].name != expected) {
        throw new GradleException("JAR must contain exactly the loader's native resource ${expected}; got ${payloads*.name}")
      }
    }
    def mb = jarFile.length() / (1024.0 * 1024.0)
    println String.format("Built JAR: %s (%.2f MB)", jarFile.absolutePath, mb)
  }
}

tasks.named('sourcesJar').configure {
  // sourcesJar includes sourceSet resources; make dependency explicit for Gradle validation.
  dependsOn tasks.named('copyNative')
}

tasks.named('test').configure {
  dependsOn tasks.named('copyNative')
  useJUnitPlatform()
  if ((JavaVersion.current().majorVersion as int) >= 22) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
  }
}

tasks.register('verifyJava11Bytecode') {
  dependsOn tasks.named('classes'), tasks.named('testClasses')
  doLast {
    [sourceSets.main.output.classesDirs, sourceSets.test.output.classesDirs].each { dirs ->
      dirs.asFileTree.matching { include '**/*.class' }.each { classFile ->
        classFile.withDataInputStream { stream ->
          if (stream.readInt() != (0xCAFEBABE as int)) throw new GradleException("Invalid class: ${classFile.name}")
          stream.readUnsignedShort()
          def major = stream.readUnsignedShort()
          if (major != 55) throw new GradleException("Expected Java11 bytecode, got major=${major} in ${classFile.name}")
        }
      }
    }
  }
}
tasks.named('check').configure { dependsOn tasks.named('verifyJava11Bytecode') }

/* -------- Smoke test: run SmokeMain from the built JAR -------- */
tasks.register('smoke', JavaExec) {
  dependsOn tasks.named('jar')
  def jarTask = tasks.named('jar').get()
  classpath files(jarTask.archiveFile)
  mainClass = 'gr.SmokeMain'
  if ((JavaVersion.current().majorVersion as int) >= 22) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
  }
}

/* -------- Dev-run without re-jar (fast iteration) -------- */
tasks.register('runSmoke', JavaExec) {
  dependsOn tasks.named('copyNative'), tasks.named('classes'), tasks.named('processResources')
  classpath sourceSets.main.runtimeClasspath
  mainClass = 'gr.SmokeMain'
  if ((JavaVersion.current().majorVersion as int) >= 22) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
  }
}

/* -------- Clean generated resources too -------- */
tasks.named('clean').configure { doLast { delete genResDir } }

/* -------- Publishing (optional) -------- */
def mavenRepoUrl = providers.environmentVariable("MAVEN_REPOSITORY_URL").orNull
def mavenUsername = providers.environmentVariable("MAVEN_USERNAME").orNull
def mavenPassword = providers.environmentVariable("MAVEN_PASSWORD").orNull
def mavenSigningKey = providers.environmentVariable("MAVEN_SIGNING_KEY").orNull
def mavenSigningPassword = providers.environmentVariable("MAVEN_SIGNING_PASSWORD").orNull

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifactId = "gr-tdigest"
      pom {
        name = "gr-tdigest"
        description = "Rust TDigest with Python, Polars and JNI"
        url = "https://github.com/ingolfured/gr-tdigest"
        licenses {
          license {
            name = "Apache License 2.0"
            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
          }
        }
        developers {
          developer {
            id = "ingolfured"
            name = "Ingolfur Edvardsson"
          }
        }
        scm {
          connection = "scm:git:git://github.com/ingolfured/gr-tdigest.git"
          developerConnection = "scm:git:ssh://github.com:ingolfured/gr-tdigest.git"
          url = "https://github.com/ingolfured/gr-tdigest"
        }
      }
    }
  }
  repositories {
    if (mavenRepoUrl != null && !mavenRepoUrl.isBlank()) {
      maven {
        name = "release"
        url = uri(mavenRepoUrl)
        credentials {
          username = mavenUsername
          password = mavenPassword
        }
      }
    }
  }
}

signing {
  if (mavenSigningKey != null && !mavenSigningKey.isBlank()) {
    useInMemoryPgpKeys(mavenSigningKey, mavenSigningPassword)
    sign publishing.publications.mavenJava
  }
}
