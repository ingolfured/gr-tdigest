[package]
name    = "gr-tdigest"
version = "0.2.5-dev2026102001"
edition = "2021"
rust-version = "1.95"
description = "Mergeable TDigest in Rust with Python, Polars, and Java bindings"
license = "Apache-2.0"
repository = "https://github.com/ingolfured/gr-tdigest"
homepage = "https://github.com/ingolfured/gr-tdigest"
documentation = "https://docs.rs/gr-tdigest"
readme = "README.md"
keywords = ["tdigest", "quantile", "cdf", "statistics", "polars"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name       = "gr_tdigest"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = [
  "dep:tdigest_core",
  "dep:pyo3",
  "pyo3/anyhow",
  "dep:numpy",
  "pyo3/extension-module",
  "pyo3/abi3-py310",
  "dep:pyo3-polars",
]
java = ["dep:jni"]
bench_codecs = []

[dependencies]
polars       = { version = "0.55.1", default-features = false, features = ["dtype-struct", "dtype-array", "fmt"] }
polars-core  = "0.55.1"
polars-arrow = "0.55.1"
polars-plan  = "0.55.1"
polars-io    = { version = "0.55.1", features = ["json"] }

jni          = { version = "0.21", optional = true }
clap         = { version = "4.5", features = ["derive"] }

pyo3-polars  = { version = "0.28", features = ["derive"], optional = true }
pyo3         = { version = "0.29.3", features = ["extension-module", "abi3-py310"], optional = true }
numpy        = { version = "0.29.0", optional = true }

# Share the original crate with the Python compatibility interface.
tdigest_core = { version = "0.2.0", path = "src/upstream", optional = true }

# --- Rust essentials ---
bincode = { version = "2.0.1", features = ["serde"] }
ordered-float  = { version = "5.1.0", features = ["serde"] }
rand           = "0.9.2"
rayon          = "1.11"
serde          = { version = "1.0.228", features = ["derive"] }
serde_json     = "1.0.145"
crc32fast      = "1.4.2"

# jemalloc on Linux only (safer TLS flag for some distros)
[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
tdigest_core = { version = "0.2.0", path = "src/upstream" }
testdata = { path = "crates/testdata" }
criterion     = "0.5"
bytesize      = "1"
libc          = "0.2"
ctor          = "0.2"
jemalloc-ctl  = "0.5"
anyhow        = "1.0"
assert_fs     = "1"
predicates    = "3"
assert_cmd    = "2"
tempfile      = "3"


[[bin]]
name = "tdigest"
path = "src/bin/tdigest_cli.rs"

[[bench]]
name = "codecs_bench"
harness = false

[[bench]]
name = "cdf_quantile_bench"
harness = false

[[bench]]
name = "tdigest_bench"
harness = false

[workspace]
members  = [".", "crates/testdata", "src/upstream"]
resolver = "2"

[profile.release]
strip = false
